<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Chalkboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toolbar">
        <!-- Native color picker -->
        <input type="color" id="color-picker" value="#ffffff" title="Choose Color">
        
        <!-- Brush size slider -->
        <input type="range" id="brush-size" min="1" max="50" value="4" title="Brush Size">
        
        <!-- Eraser button -->
        <div class="tool-btn" id="eraser-btn" title="Eraser">🧹</div>
    </div>

    <div id="counter">👤 <span id="user-count">1</span></div>
    <canvas id="chalkboard"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
