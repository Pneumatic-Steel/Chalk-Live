<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Chalkboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toolbar">
        <input type="color" id="color-picker" value="#ffffff" title="Choose Color">
        <input type="range" id="brush-size" min="1" max="50" value="4" title="Brush Size/Sticker Size">
        
        <select id="brush-effect" title="Brush Effect">
            <option value="none">Solid Color</option>
            <option value="rainbow">🌈 Rainbow</option>
            <option value="fire">🔥 Fire</option>
            <option value="mystic">🔮 Mystic</option>
            <option value="galaxy">🌌 Galaxy</option>
        </select>
        
        <!-- The Emoji Sticker Tool -->
        <div class="tool-btn" id="emoji-btn" title="Emoji Stamp Mode">😀</div>
        <input type="text" id="emoji-input" placeholder="🐶" maxlength="5" title="Type an emoji here!">
        
        <div class="tool-btn" id="eraser-btn" title="Eraser">🧹</div>
        <div class="tool-btn" id="clear-btn" title="Clear Board">🗑️</div>
    </div>

    <div id="counter">👤 <span id="user-count">1</span></div>
    <canvas id="chalkboard"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
